<!doctype html><html><head><meta charset="utf-8"><title>MarketLens</title>
<style>
:root{--bg:#fff;--fg:#111;--mut:#666;--line:#ddd;--up:#1a7f37;--dn:#c0392b;--card:#f7f7f7;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--fg:#eee;--mut:#999;--line:#333;--up:#4ade80;--dn:#f87171;--card:#1c1c1c;color-scheme:dark}}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);margin:0;padding:20px;max-width:1100px;margin:auto}
h1{font-size:1.4rem}.mut{color:var(--mut);font-size:.9rem}
.warn{border:1px solid var(--line);padding:10px;border-radius:6px;margin:12px 0;font-size:.9rem}
table{border-collapse:collapse;width:100%;margin-top:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}
.up{color:var(--up);font-weight:600}.dn{color:var(--dn);font-weight:600}
.card{background:var(--card);padding:12px;border-radius:8px;margin:10px 0}
input,button{padding:8px;font-size:1rem}button{cursor:pointer}
</style></head><body>
<h1>MarketLens — research signals</h1>
<div class="warn">Probabilities, not promises. Expect 50–60% on short horizons. Paper trade only. Check the <a href="#acc">accuracy log</a> before trusting anything.</div>
<p class="mut" id="when">Loading…</p>
<p><input id="q" placeholder="asset key e.g. GOLD, RELIANCE"> <button onclick="lookup()">Analyze now</button> <button onclick="runAll()">Re-run all</button></p>
<div id="detail"></div>
<table id="t"><thead><tr><th>Asset</th><th>Price</th><th>1h</th><th>6h</th><th>1d</th><th>1w</th><th>1m</th><th>Why</th></tr></thead><tbody></tbody></table>
<h2 id="acc" style="font-size:1.1rem;margin-top:30px">Accuracy so far (resolved predictions, excluding "no edge")</h2>
<table id="a"><thead><tr><th>Asset</th><th>Horizon</th><th>N</th><th>Accuracy</th></tr></thead><tbody></tbody></table>
<script>
const cls=l=>l==='lean buy'?'up':l==='lean sell'?'dn':'';
const cell=h=>`<td class="${cls(h.label)}">${(h.prob_up*100).toFixed(0)}% ${h.label}</td>`;
async function load(){
  const r=await fetch('/api/latest').then(r=>r.json());
  document.getElementById('when').textContent=r.run_time?'Last run: '+new Date(r.run_time*1000).toLocaleString():'No run yet';
  const tb=document.querySelector('#t tbody');tb.innerHTML='';
  for(const [k,a] of Object.entries(r.assets)){
    const h=a.horizons;
    tb.innerHTML+=`<tr><td>${a.name}</td><td>${a.price}</td>${cell(h['1h'])}${cell(h['6h'])}${cell(h['1d'])}${cell(h['1w'])}${cell(h['1m'])}<td class="mut">${a.reasons.technical}<br>${a.reasons.sentiment||''}</td></tr>`;}
  const ac=await fetch('/api/accuracy').then(r=>r.json());
  const ab=document.querySelector('#a tbody');ab.innerHTML=ac.length?'':'<tr><td colspan=4 class="mut">Nothing resolved yet. Come back after a few hours.</td></tr>';
  for(const x of ac) ab.innerHTML+=`<tr><td>${x.asset}</td><td>${x.horizon}</td><td>${x.n}</td><td>${(x.accuracy*100).toFixed(0)}%</td></tr>`;
}
async function lookup(){
  const k=document.getElementById('q').value.trim();if(!k)return;
  const d=document.getElementById('detail');d.innerHTML='<p class="mut">Analyzing…</p>';
  const a=await fetch('/api/asset/'+k).then(r=>r.json());
  if(a.error){d.innerHTML='<p class="dn">'+a.error+'</p>';return;}
  d.innerHTML=`<div class="card"><b>${a.name}</b> ${a.price}<br>
  ${Object.entries(a.horizons).map(([h,v])=>`<span class="${cls(v.label)}">${h}: ${(v.prob_up*100).toFixed(0)}% ${v.label}</span>`).join(' · ')}
  <p><b>Technical:</b> ${a.reasons.technical}<br><b>Sentiment:</b> ${a.reasons.sentiment}<br><b>Fundamental:</b> ${a.reasons.fundamental}</p>
  <p class="mut">${a.news.map(n=>`• ${n.title}`).join('<br>')}</p></div>`;
}
async function runAll(){document.getElementById('when').textContent='Running all (1–3 min)…';await fetch('/api/run',{method:'POST'});load();}
load();
</script></body></html>
